name: Build and deploy

# Runs for the production branch. Day-to-day work happens on `development`;
# merging `development` into `live` ships the site to Hostinger.
on:
  push:
    branches: [live]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Analytics IDs and the site URL are GitHub repository variables
      # (Settings → Secrets and variables → Actions → Variables). Only this build
      # gets them, so localhost and preview builds never send analytics.
      - name: Build
        run: npm run build
        env:
          PUBLIC_GA_ID: ${{ vars.GA_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.CLARITY_ID }}
          PUBLIC_AHREFS_KEY: ${{ vars.AHREFS_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Check analytics IDs are in the build
        run: |
          grep -q "gtag/js?id=${{ vars.GA_ID }}" dist/index.html || { echo "::warning::GA_ID missing from the build"; }
          grep -q "analytics.ahrefs.com" dist/index.html || { echo "::warning::AHREFS_KEY missing from the build"; }
          grep -q "__clarityId" dist/index.html || { echo "::warning::CLARITY_ID missing from the build"; }

      # Hashes of the pages from the last deploy, so IndexNow only sends what changed.
      - name: Restore IndexNow state
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      # lftp instead of FTP-Deploy-Action (Oct 2026): Hostinger's FTP drops the
      # control connection mid-upload, and FTP-Deploy-Action could neither
      # resume nor recover. Each failed run also left Pure-FTPd temp files
      # (".in.<name>.") that block the next upload with "550 ... already exists".
      # lftp retries and reconnects, and we clear those temp files first
      # (ftp:list-options -a, because Pure-FTPd hides dot-files from listings).
      # --overwrite replaces files in place: without it lftp deletes the live
      # file first, so a failed upload took the page down (403).
      # Server-only files (mail autoconfig etc.) are left in place: no --delete.
      # Hostinger's FTP certificate is issued to its own server name, not to
      # FTP_HOST, so only the host-name match is skipped; the connection is
      # still TLS-encrypted and the certificate chain is still verified.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy dist/ to Hostinger public_html
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          deploy() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:check-hostname no
          set ftp:list-options -a
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set cmd:fail-exit no
          glob -a rm -f .in.* */.in.* */*/.in.* */*/*/.in.* */*/*/*/.in.*
          set cmd:fail-exit yes
          mirror --reverse --overwrite --verbose=1 --parallel=2 --no-perms --exclude-glob .git* --exclude-glob .DS_Store ./dist/ ./
          bye
          LFTP
          }
          deploy || { echo "::warning::First upload attempt failed, retrying in 20s"; sleep 20; deploy; }

      # After the upload, so the key file is live when IndexNow checks it.
      # A failed ping never fails the deploy; unsent URLs go out next time.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
